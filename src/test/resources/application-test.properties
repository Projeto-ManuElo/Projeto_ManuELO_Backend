# Perfil de teste: Postgres real (runtime embutido do juiz ou DB_URL do ambiente).
# Não usa Testcontainers/docker. DEC-I09 (JUnit 5 + Spring Boot Test contra Postgres).
spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:postgresql://127.0.0.1:55433/manuelo}}
spring.datasource.username=${TEST_DB_USER:${DB_USER:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Evita abrir navegador/telemetria durante os testes.
vaadin.launch-browser=false

manuelo.admin.email=${MANUELO_ADMIN_EMAIL:qa@manuelo.local}
manuelo.admin.senha=${MANUELO_ADMIN_SENHA:qa-admin-123}
