vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,br.com.manuelo
logging.level.org.atmosphere=warn
spring.application.name=Manuelo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11

server.port=${PORT:${APP_PORT:8080}}

# Administrador inicial de desenvolvimento (troque em produção; ver AGENTS.md).
manuelo.admin.email=${MANUELO_ADMIN_EMAIL:admin@manuelo.local}
manuelo.admin.senha=${MANUELO_ADMIN_SENHA:admin123}

# A-13 (DEC-I05): URL base usada no link de redefinição de senha.
manuelo.app.url=${MANUELO_APP_URL:http://localhost:8080}

# A-50 (DEC-I06): diretório do armazenamento local de documentos.
manuelo.storage.dir=${MANUELO_STORAGE_DIR:${java.io.tmpdir}/manuelo-documentos}