vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,br.com.manuelo
logging.level.org.atmosphere=warn
spring.application.name=Manuelo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# A-80: persistência continua em UTC; a apresentação (Jackson) usa o fuso do app.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=${APP_TIMEZONE:America/Sao_Paulo}

# A-80: locale fixo pt-BR para mensagens e formatação no servidor.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11

server.port=${PORT:${APP_PORT:8080}}

# Perfis: dev define defaults locais; prod exige MANUELO_ADMIN_EMAIL/SENHA do ambiente.
# O perfil test fica em src/test/resources/application-test.properties.
spring.profiles.default=dev