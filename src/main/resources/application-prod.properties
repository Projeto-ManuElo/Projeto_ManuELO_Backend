# Perfil de produção: sem segredos nem defaults perigosos.
# MANUELO_ADMIN_EMAIL e MANUELO_ADMIN_SENHA são obrigatórios no ambiente.
manuelo.admin.email=${MANUELO_ADMIN_EMAIL}
manuelo.admin.senha=${MANUELO_ADMIN_SENHA}

# Obrigatórios: URL pública do link de senha e volume persistente de documentos.
manuelo.app.url=${MANUELO_APP_URL}
manuelo.storage.dir=${MANUELO_STORAGE_DIR}

# Atrás de proxy/load balancer (Railway, Render, etc.).
server.forward-headers-strategy=framework

# Nunca altere o schema em produção; as migrations são a fonte da verdade.
spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO
vaadin.launch-browser=false
