# Perfil de produção: sem segredos nem defaults perigosos.
# MANUELO_ADMIN_EMAIL e MANUELO_ADMIN_SENHA são obrigatórios no ambiente.
manuelo.admin.email=${MANUELO_ADMIN_EMAIL}
manuelo.admin.senha=${MANUELO_ADMIN_SENHA}

# Obrigatórios: URL pública do link de senha e volume persistente de documentos.
manuelo.app.url=${MANUELO_APP_URL}
manuelo.storage.dir=${MANUELO_STORAGE_DIR}

# Atrás de proxy/load balancer (Railway, Render, etc.).
server.forward-headers-strategy=framework

# F01: SMTP real, somente por variáveis de ambiente (nenhum segredo no repositório).
# Host vazio desliga o envio; o serviço registra um WARN sem PII nesse caso.
spring.mail.host=${MANUELO_MAIL_HOST:}
spring.mail.port=${MANUELO_MAIL_PORT:587}
spring.mail.username=${MANUELO_MAIL_USER:}
spring.mail.password=${MANUELO_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MANUELO_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MANUELO_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Nunca altere o schema em produção; as migrations são a fonte da verdade.
spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO
vaadin.launch-browser=false
