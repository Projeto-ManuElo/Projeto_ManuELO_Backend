# Perfil de desenvolvimento: defaults locais, nunca usados em produção.
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Administrador inicial de desenvolvimento (troque via env se necessário).
manuelo.admin.email=${MANUELO_ADMIN_EMAIL}
manuelo.admin.senha=${MANUELO_ADMIN_SENHA}

# A-13 (DEC-I05): URL base usada no link de redefinição de senha.
manuelo.app.url=${MANUELO_APP_URL:http://localhost:8080}

# A-50 (DEC-I06): diretório do armazenamento local de documentos.
manuelo.storage.dir=${MANUELO_STORAGE_DIR:${java.io.tmpdir}/manuelo-documentos}
