services:
  db:
    image: postgres:16
    container_name: manuelo-db
    environment:
      POSTGRES_USER: manuelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manuelo_dev}
      POSTGRES_DB: manuelo
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manuelo -d manuelo"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - manuelo_pgdata:/var/lib/postgresql/data

volumes:
  manuelo_pgdata:
